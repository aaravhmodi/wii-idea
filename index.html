<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotionPlay AI</title>
  <style>
    /* Quiet white-and-pale-blue console menu: thin type, hairlines, lots of white. Type is Geist, as on the Enerzen site. */
    :root { --bg: #f3f6f8; --surface: #ffffff; --tint: #eaf6fb; --line: #dbe6ec; --line-strong: #b5d6e6; --ink: #3f4852; --ink-soft: #66707b;
      --accent: #0b7aa8; --accent-deep: #095f83; --go: #3c7d2e; --warn: #b3392f;
      --font: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --shadow: 0 1px 2px rgb(40 55 70 / .04), 0 14px 30px -20px rgb(40 55 70 / .22); }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 32vw, 440px); background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
    #game { position: relative; min-width: 0; height: 100vh; }
    /* Faint horizontal pinstripes, the one decorative nod to mid-2000s console menus. */
    aside { height: 100vh; height: 100dvh; min-width: 0; overflow-y: auto; padding: 28px 24px; border-left: 1px solid var(--line);
      background: repeating-linear-gradient(#f7f9fa 0 3px, #f1f4f6 3px 4px); display: flex; flex-direction: column; gap: 18px; scroll-padding-top: 72px; }
    aside > * { flex-shrink: 0; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: 11px; font-weight: 500; letter-spacing: .16em; line-height: 1.4; text-transform: uppercase; }
    aside h1 { margin: 0; font-size: 34px; font-weight: 300; line-height: 1.05; letter-spacing: -.035em; color: var(--ink); }
    aside h1 span { color: var(--accent); font-weight: 500; }
    .tagline { margin: 8px 0 0; color: var(--ink-soft); }
    #pair, .tabpanel > section, .tabpanel > .row { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); }
    #pair { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px 18px; align-items: center; padding: 18px; }
    #pair h2 { grid-column: 1 / -1; margin: 0; font-size: 19px; font-weight: 500; letter-spacing: -.02em; }
    #qr { width: 116px !important; height: 116px !important; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .pair-steps { margin: 0; color: var(--ink-soft); font-size: 14px; }
    .pair-steps strong { display: block; color: var(--ink); font-weight: 500; }
    #status { grid-column: 1 / -1; display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
    #status::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #5fa24f; box-shadow: 0 0 0 4px #e3f0df; }
    #url { grid-column: 1 / -1; font: 11.5px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--ink-soft); overflow-wrap: anywhere; }
    #url:empty { display: none; }
    aside .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    #tabs { position: sticky; top: -28px; z-index: 2; display: flex; gap: 22px; padding: 14px 2px 0; margin: 0 -2px; background: #f4f7f8; border-bottom: 1px solid var(--line); }
    #tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--ink-soft); padding: 6px 0 10px; margin-bottom: -1px; cursor: pointer; font: 500 15px/1.2 var(--font); letter-spacing: -.01em; }
    #tabs button:hover { color: var(--ink); }
    #tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
    #tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
    .tabpanel { display: flex; flex-direction: column; gap: 14px; }
    .tabpanel[hidden] { display: none; }
    .tabpanel > .row, .tabpanel > section { min-width: 0; padding: 20px; gap: 10px; }
    .tabpanel > .row > button { flex: 1 1 auto; }
    /* ID scoping keeps these rules above the panels' injected styles. */
    #voice .voice, #adapt .adapt, #twin .twin, #plan .plan, #lab .swing-lab { border: 0; padding: 0; background: transparent; gap: 12px; }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) :is(p, li, label, span, a, div, strong, h2, h3, button, textarea) { font-family: var(--font); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) :is(h2, h3) { margin: 0; font-size: 19px; font-weight: 500; line-height: 1.2; letter-spacing: -.02em; text-transform: none; color: var(--ink); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) h3 { font-size: 15px; }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) p { margin: 0; font-size: 14px; font-weight: 400; line-height: 1.55; color: var(--ink-soft); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) :is([aria-live], [data-numbers], [data-settings], [data-progress], [data-note]) { font-size: 13.5px; font-weight: 500; line-height: 1.5; font-variant-numeric: tabular-nums; color: var(--ink); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) button, #newgame, #simulate { min-height: 44px; max-width: 100%; padding: 10px 18px; cursor: pointer; text-transform: none; letter-spacing: -.005em;
      border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font: 500 14.5px/1.2 var(--font); box-shadow: none; transition: background .15s, border-color .15s; }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) button:hover:enabled, #newgame:hover:enabled, #simulate:hover:enabled { background: var(--tint); border-color: var(--accent); color: var(--ink); }
    #newgame, aside #voice button, aside #adapt button[data-go], aside #plan button, aside #camera button { background: var(--accent); border-color: var(--accent); color: #fff; }
    #newgame:hover:enabled, aside #voice button:hover:enabled, aside #adapt button[data-go]:hover:enabled, aside #plan button:hover:enabled, aside #camera button:hover:enabled { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
    aside #voice button[aria-pressed=true] { background: var(--surface); border-color: var(--warn); color: var(--warn); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) button:disabled, #newgame:disabled, #simulate:disabled { background: #f1f4f6; border-color: var(--line); color: #7a848e; cursor: default; opacity: 1; }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) :focus-visible, #newgame:focus-visible, #simulate:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    aside :is(button, a, textarea) { scroll-margin-block: 72px 12px; }
    aside canvas { border: 1px solid var(--line) !important; border-radius: 12px; background: #f6fafc; }
    #replay canvas, #camera canvas { background: #1f2a33; }
    #voice p:empty { display: none; }
    #voice [data-coach], #adapt [data-drill], #plan [data-focus], #replay [data-tip], #lab .sl-tip { border-left: 2px solid var(--accent); border-radius: 0; padding-left: 12px; color: var(--ink); font-weight: 400; }
    #adapt [data-settings] { border-top: 1px solid var(--line); padding-top: 10px; }
    #adapt :is(label, ul), #twin a { font-size: 14px; color: var(--ink-soft); }
    #twin a { color: var(--accent); }
    #adapt textarea { font: 14.5px/1.5 var(--font); border: 1px solid var(--line-strong); border-radius: 12px; background: #fff; color: var(--ink); }
    #adapt textarea::placeholder { color: #7a848e; opacity: 1; }
    #adapt textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #replay { display: grid; gap: 12px; }
    #lab .sl-heading { flex-wrap: wrap; }
    #lab .swing-lab > .sl-heading { padding: 0; border: 0; }
    #lab .sl-card { padding: 16px 0 0; border: 0; border-top: 1px solid var(--line); background: transparent; }
    #lab .sl-stats { border: 0; gap: 8px; }
    #lab .sl-stat { border: 1px solid var(--line) !important; border-radius: 12px; background: #fafcfd; text-align: left; padding: 12px; }
    #lab .sl-stat strong { color: var(--ink); font-family: var(--font); font-weight: 400; font-size: 24px; letter-spacing: -.03em; }
    #lab :is(.sl-muted, .sl-legend, .sl-stat span) { color: var(--ink-soft); font-size: 12.5px; }
    #lab .sl-result { padding: 0; border: 0 !important; background: none; color: var(--go); font-weight: 500; text-align: left; }
    #lab .sl-coach[aria-live] { font: 400 14.5px/1.55 var(--font); color: var(--ink); }
    @media (max-width: 800px) {
      body { grid-template-columns: minmax(0, 1fr); }
      #game { height: 55vh; height: 55svh; }
      aside { height: auto; overflow: visible; border-left: 0; border-top: 1px solid var(--line); padding: 24px max(16px, calc((100% - 600px) / 2)); }
      #tabs { top: 0; }
    }
    @media (max-width: 380px) {
      aside h1 { font-size: 30px; }
      #pair { grid-template-columns: 104px minmax(0, 1fr); gap: 10px; padding: 14px; }
      #qr { width: 104px !important; height: 104px !important; }
      .tabpanel > .row, .tabpanel > section { padding: 16px; }
      #lab .sl-stats { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { aside button { transition: none; } }
  </style>
</head>
<body>
  <main id="game" aria-label="Bowling lane"></main>
  <aside>
    <header>
      <p class="eyebrow">Single player / Ten frames</p>
      <h1>Motion<span>Play</span> Bowl</h1>
      <p class="tagline">Your phone. Your swing. Your lane.</p>
    </header>
    <section id="pair" aria-label="Connect your phone">
      <h2>Scan to bowl</h2>
      <canvas id="qr" role="img" aria-label="QR code that opens the controller on your phone"></canvas>
      <p class="pair-steps"><strong>Enable motion.</strong> Hold the screen, swing, then release your touch. Keep a firm grip.</p>
      <div id="status" aria-live="polite">Starting…</div>
      <div id="url"></div>
    </section>
    <nav id="tabs" role="tablist" aria-label="Side panels">
      <button type="button" role="tab" id="t-play" aria-controls="tab-play" aria-selected="true">Play</button>
      <button type="button" role="tab" id="t-replay" aria-controls="tab-replay" aria-selected="false">Replay</button>
      <button type="button" role="tab" id="t-coach" aria-controls="tab-coach" aria-selected="false">Coach</button>
    </nav>
    <div id="tab-play" class="tabpanel" role="tabpanel" aria-labelledby="t-play">
      <div class="row"><button id="newgame" type="button">New game</button><button id="simulate" type="button">Simulated throw</button></div>
      <section id="voice" aria-label="Voice coach"></section>
      <section id="camera" aria-label="Camera coach"></section>
      <section id="adapt" aria-label="Adapt the controls to you"></section>
    </div>
    <div id="tab-replay" class="tabpanel" role="tabpanel" aria-labelledby="t-replay" hidden>
      <section id="twin" aria-label="Phone replay"></section>
      <section id="replay" aria-label="Camera replay"></section>
    </div>
    <div id="tab-coach" class="tabpanel" role="tabpanel" aria-labelledby="t-coach" hidden>
      <section id="lab" aria-label="Swing Lab"></section>
      <section id="plan" aria-label="Training plan"></section>
    </div>
  </aside>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
