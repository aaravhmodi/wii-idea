<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotionPlay AI</title>
  <style>
    /* Bright, rounded "living-room sports" look: sky and white, glossy pill buttons, soft cards. */
    :root { --sky: #dff3ff; --card: #ffffff; --line: #cfe3f1; --text: #33485c; --muted: #5a6f82; --blue: #1878ba; --blue-d: #115a92; --blue-l: #63c4f4;
      --green: #2f8a1f; --orange: #ff9a1f; --red: #d63a2f;
      --round: "Arial Rounded MT Bold", "Varela Round", Nunito, "Segoe UI", system-ui, sans-serif;
      --body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-columns: minmax(0, 1fr) clamp(360px, 32vw, 440px); background: linear-gradient(#bfe6ff, #f4fbff); color: var(--text); font: 16px/1.5 var(--body); }
    #game { position: relative; min-width: 0; height: 100vh; }
    aside { height: 100vh; height: 100dvh; min-width: 0; overflow-y: auto; padding: 20px; background: linear-gradient(#eaf7ff, #ffffff 40%); box-shadow: -6px 0 24px rgba(17, 90, 146, .18);
      display: flex; flex-direction: column; gap: 16px; scroll-padding-top: 80px; }
    aside > * { flex-shrink: 0; }
    aside header { text-align: center; }
    .eyebrow { display: inline-block; margin: 0 0 6px; padding: 3px 12px; border-radius: 999px; background: var(--blue-d); color: #fff; font: 700 12px/1.5 var(--body); letter-spacing: .04em; }
    aside h1 { margin: 0; font: 800 38px/1.05 var(--round); color: var(--blue-d); letter-spacing: -.5px; }
    aside h1 span { color: var(--red); }
    .tagline { margin: 4px 0 0; color: var(--muted); }
    #pair, .tabpanel > section, .tabpanel > .row { background: var(--card); border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 #c2dcee, 0 10px 22px rgba(17, 90, 146, .12); }
    #pair { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 10px 16px; align-items: center; padding: 16px; }
    #pair h2 { grid-column: 1 / -1; margin: 0; font: 800 24px/1.1 var(--round); color: var(--blue-d); }
    #qr { width: 124px; height: 124px; border: 3px solid var(--line); border-radius: 14px; background: #fff; }
    .pair-steps { margin: 0; }
    .pair-steps strong { display: block; color: var(--blue-d); }
    #status { grid-column: 1 / -1; padding: 8px 14px; border-radius: 999px; background: linear-gradient(#eafbe2, #d2f3c2); border: 2px solid #9ed884; color: #1d5a12; font: 700 15px/1.4 var(--body); text-align: center; overflow-wrap: anywhere; }
    #url { grid-column: 1 / -1; font: 12px/1.45 ui-monospace, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; }
    #url:empty { display: none; }
    aside .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    #tabs { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px; border-radius: 999px; background: #cfe9f9; box-shadow: inset 0 2px 4px rgba(17, 90, 146, .2), 0 6px 14px rgba(17, 90, 146, .15); }
    #tabs button { min-height: 46px; border: 0; border-radius: 999px; background: transparent; color: var(--blue-d); padding: 8px 4px; cursor: pointer; font: 800 19px/1.2 var(--round); }
    #tabs button:hover { background: #e6f5ff; }
    #tabs button[aria-selected=true] { background: linear-gradient(#ffffff, #eaf6fd); box-shadow: 0 2px 0 #b7d6ea, 0 4px 10px rgba(17, 90, 146, .2); }
    #tabs button:focus-visible { outline: 3px solid var(--blue-d); outline-offset: 2px; }
    .tabpanel { display: flex; flex-direction: column; gap: 16px; }
    .tabpanel[hidden] { display: none; }
    .tabpanel > .row, .tabpanel > section { min-width: 0; padding: 18px; gap: 12px; }
    .tabpanel > .row > button { flex: 1 1 auto; }
    /* ID scoping keeps these rules above the panels' injected styles. */
    #voice .voice, #adapt .adapt, #twin .twin, #plan .plan, #lab .swing-lab { border: 0; padding: 0; background: transparent; gap: 12px; }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) :is(p, li, label, span, a, div, strong) { font-family: var(--body); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) :is(h2, h3) { margin: 0; font: 800 22px/1.15 var(--round); text-transform: none; letter-spacing: 0; color: var(--blue-d); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) h3 { font-size: 17px; }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--text); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) :is([aria-live], [data-numbers], [data-settings], [data-progress], [data-note]) { font: 700 14px/1.45 var(--body); font-variant-numeric: tabular-nums; color: var(--blue-d); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) button, #newgame, #simulate { min-height: 46px; max-width: 100%; padding: 9px 20px; cursor: pointer; text-transform: none;
      border: 3px solid #fff; border-radius: 999px; background: linear-gradient(#1f86cc, #115a92); color: #fff; font: 800 17px/1.2 var(--round);
      box-shadow: 0 0 0 2px #115a92, 0 4px 0 2px #0c4674, 0 10px 16px rgba(17, 90, 146, .3); transition: transform .08s; }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) button:hover:enabled, #newgame:hover:enabled, #simulate:hover:enabled { background: linear-gradient(#2a95dd, #15659f); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) button:active:enabled, #newgame:active:enabled, #simulate:active:enabled { transform: translateY(3px); box-shadow: 0 0 0 2px #115a92, 0 1px 0 2px #0c4674; }
    #simulate, #adapt button[data-reset], #lab button { background: linear-gradient(#ffffff, #e3f1fa); color: var(--blue-d); box-shadow: 0 0 0 2px #9cc4de, 0 4px 0 2px #8ab4d0, 0 10px 16px rgba(17, 90, 146, .15); }
    #simulate:hover:enabled, #adapt button[data-reset]:hover:enabled, #lab button:hover:enabled { background: linear-gradient(#ffffff, #d3e9f6); }
    #newgame, #adapt button[data-go], #plan button { background: linear-gradient(#3f9c2b, #256f18); box-shadow: 0 0 0 2px #256f18, 0 4px 0 2px #1a5210, 0 10px 16px rgba(37, 111, 24, .3); }
    #newgame:hover:enabled, #adapt button[data-go]:hover:enabled, #plan button:hover:enabled { background: linear-gradient(#49aa33, #2a7a1c); }
    #voice button[aria-pressed=true], #camera button.on { background: linear-gradient(#e0513f, #b02a20); box-shadow: 0 0 0 2px #b02a20, 0 4px 0 2px #861c14, 0 10px 16px rgba(176, 42, 32, .3); }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) button:disabled, #newgame:disabled, #simulate:disabled { background: #e6edf2; color: #5a6f82; box-shadow: 0 0 0 2px #c5d3dd; cursor: default; opacity: 1; }
    aside :is(#voice, #camera, #adapt, #twin, #replay, #lab, #plan) :focus-visible, #newgame:focus-visible, #simulate:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; }
    aside :is(button, a, textarea) { scroll-margin-block: 80px 12px; }
    aside canvas { border: 3px solid var(--line) !important; border-radius: 16px; background: #eef8ff; }
    #replay canvas, #camera canvas { background: #20303f; }
    #voice p:empty { display: none; }
    #voice [data-coach], #adapt [data-drill], #plan [data-focus], #replay [data-tip], #lab .sl-tip { border-left: 5px solid var(--orange); border-radius: 4px; padding-left: 10px; }
    #adapt [data-settings] { border-top: 2px dashed var(--line); }
    #adapt :is(label, ul), #twin a { font-size: 15px; color: var(--text); }
    #adapt textarea { font: 15px/1.5 var(--body); border: 2px solid var(--line); border-radius: 14px; background: #f6fbff; color: var(--text); }
    #adapt textarea::placeholder { color: var(--muted); opacity: 1; }
    #adapt textarea:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
    #replay { display: grid; gap: 12px; }
    #lab .sl-heading { flex-wrap: wrap; }
    #lab .swing-lab > .sl-heading { padding: 0; border: 0; }
    #lab .sl-card { padding: 14px 0 0; border: 0; border-top: 2px solid var(--line); background: transparent; }
    #lab .sl-stats { border: 0; gap: 8px; }
    #lab .sl-stat { border: 2px solid var(--line) !important; border-radius: 16px; background: #f3faff; text-align: center; }
    #lab .sl-stat strong { color: var(--blue-d); font-family: var(--round); }
    #lab :is(.sl-muted, .sl-legend, .sl-stat span) { color: var(--muted); font-size: 13px; }
    #lab .sl-result { padding: 8px 16px; border: 2px solid #9ed884 !important; border-radius: 999px; background: linear-gradient(#eafbe2, #d2f3c2); color: #1d5a12; text-align: center; }
    #lab .sl-coach[aria-live] { font: 15px/1.5 var(--body); color: var(--text); }
    @media (max-width: 800px) {
      body { grid-template-columns: minmax(0, 1fr); }
      #game { height: 55vh; height: 55svh; }
      aside { height: auto; overflow: visible; box-shadow: none; padding: 20px max(16px, calc((100% - 600px) / 2)); }
    }
    @media (max-width: 380px) {
      aside h1 { font-size: 32px; }
      #pair { grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 12px; }
      #qr { width: 112px; height: 112px; }
      .tabpanel > .row, .tabpanel > section { padding: 14px; }
      #lab .sl-stats { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { aside button { transition: none; } }
  </style>
</head>
<body>
  <main id="game" aria-label="Bowling lane"></main>
  <aside>
    <header>
      <p class="eyebrow">Single player / Ten frames</p>
      <h1>Motion<span>Play</span> Bowl</h1>
      <p class="tagline">Your phone. Your swing. Your lane.</p>
    </header>
    <section id="pair" aria-label="Connect your phone">
      <h2>Scan to bowl</h2>
      <canvas id="qr" role="img" aria-label="QR code that opens the controller on your phone"></canvas>
      <p class="pair-steps"><strong>Enable motion.</strong> Hold the screen, swing, then release your touch. Keep a firm grip.</p>
      <div id="status" aria-live="polite">Starting…</div>
      <div id="url"></div>
    </section>
    <nav id="tabs" role="tablist" aria-label="Side panels">
      <button type="button" role="tab" id="t-play" aria-controls="tab-play" aria-selected="true">Play</button>
      <button type="button" role="tab" id="t-replay" aria-controls="tab-replay" aria-selected="false">Replay</button>
      <button type="button" role="tab" id="t-coach" aria-controls="tab-coach" aria-selected="false">Coach</button>
    </nav>
    <div id="tab-play" class="tabpanel" role="tabpanel" aria-labelledby="t-play">
      <div class="row"><button id="newgame" type="button">New game</button><button id="simulate" type="button">Simulated throw</button></div>
      <section id="voice" aria-label="Voice coach"></section>
      <section id="camera" aria-label="Camera coach"></section>
      <section id="adapt" aria-label="Adapt the controls to you"></section>
    </div>
    <div id="tab-replay" class="tabpanel" role="tabpanel" aria-labelledby="t-replay" hidden>
      <section id="twin" aria-label="Phone replay"></section>
      <section id="replay" aria-label="Camera replay"></section>
    </div>
    <div id="tab-coach" class="tabpanel" role="tabpanel" aria-labelledby="t-coach" hidden>
      <section id="lab" aria-label="Swing Lab"></section>
      <section id="plan" aria-label="Training plan"></section>
    </div>
  </aside>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
