<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotionPlay AI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-columns: 1fr 380px; background: #f2e8d5; color: #1b2238; font: 15px/1.45 Georgia, serif; }
    #game { position: relative; min-width: 0; height: 100vh; }
    aside { height: 100vh; overflow-y: auto; padding: 18px; border-left: 4px solid #1b2238; display: flex; flex-direction: column; gap: 16px; }
    h1 { font: 400 34px/1 Impact, "Arial Narrow Bold", Haettenschweiler, sans-serif; text-transform: uppercase; margin: 0; padding-bottom: 8px; border-bottom: 4px double #1b2238; }
    h1 span { color: #d23b2a; }
    #pair { display: flex; gap: 12px; align-items: center; border: 2px solid #1b2238; background: #fffaf0; padding: 10px; }
    #qr { width: 112px; height: 112px; border: 2px solid #1b2238; background: #fff; flex: none; }
    #status { font: 700 14px "Courier New", ui-monospace, monospace; color: #d23b2a; margin-bottom: 4px; }
    #newgame { align-self: start; border: 2px solid #1b2238; background: #e0a526; color: #1b2238; padding: 8px 16px; cursor: pointer;
      font: 400 18px Impact, "Arial Narrow Bold", Haettenschweiler, sans-serif; text-transform: uppercase; box-shadow: 4px 4px 0 #1b2238; }
    #newgame:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #1b2238; }
    #newgame:disabled { opacity: .5; box-shadow: none; }
    #newgame:focus-visible { outline: 3px solid #d23b2a; outline-offset: 3px; }
    #url { font: 11px "Courier New", ui-monospace, monospace; word-break: break-all; margin-top: 4px; }
    @media (max-width: 800px) { body { grid-template-columns: 1fr; } #game { height: 60vh; } aside { height: auto; border-left: 0; border-top: 4px solid #1b2238; } }
  </style>
</head>
<body>
  <main id="game" aria-label="Bowling lane"></main>
  <aside>
    <h1>Motion<span>Play</span> Bowl</h1>
    <section id="pair" aria-label="Connect your phone">
      <canvas id="qr" role="img" aria-label="QR code that opens the controller on your phone"></canvas>
      <div>
        <div id="status" aria-live="polite">Starting…</div>
        <div>Scan with your phone, hold anywhere on its screen, swing, let go.</div>
        <div id="url"></div>
      </div>
    </section>
    <section id="camera" aria-label="Camera coach"></section>
    <section id="replay" aria-label="Last throw replay"></section>
    <section id="adapt" aria-label="Adapt the controls to you"></section>
    <button id="newgame" type="button">New game</button>
    <section id="lab" aria-label="Swing Lab"></section>
  </aside>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
