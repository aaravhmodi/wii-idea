<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MotionPlay AI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-columns: 1fr 380px; background: #0b0d12; color: #e8eaf0; font: 15px/1.4 system-ui, sans-serif; }
    #game { position: relative; min-width: 0; height: 100vh; }
    aside { height: 100vh; overflow-y: auto; padding: 16px; border-left: 1px solid #232733; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 18px; margin: 0; }
    #pair { display: flex; gap: 12px; align-items: center; }
    #qr { width: 112px; height: 112px; border-radius: 8px; background: #fff; flex: none; }
    #status { font-weight: 600; }
    #url { font-size: 12px; color: #9aa3b5; word-break: break-all; }
    @media (max-width: 800px) { body { grid-template-columns: 1fr; } #game { height: 60vh; } aside { height: auto; border-left: 0; } }
  </style>
</head>
<body>
  <main id="game" aria-label="Bowling lane"></main>
  <aside>
    <h1>MotionPlay AI</h1>
    <section id="pair" aria-label="Connect your phone">
      <canvas id="qr" role="img" aria-label="QR code that opens the controller on your phone"></canvas>
      <div>
        <div id="status" aria-live="polite">Starting…</div>
        <div>Scan with your phone, hold the button, swing, let go.</div>
        <div id="url"></div>
      </div>
    </section>
    <section id="lab" aria-label="Swing Lab"></section>
  </aside>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
